name: export
on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run export-content
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      # エクスポート結果で local ビルドが通ることを確認してからコミットする
      # （これが通らない状態をコミットすると保険にならない）
      - run: CONTENT_SOURCE=local npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}

      - name: Commit exported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップ"
          else
            git commit -m "chore: microCMS から記事をエクスポート (W6)"
            git push
          fi
