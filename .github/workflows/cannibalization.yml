name: cannibalization
on:
  schedule:
    # 毎月1日 06:00 JST = 前月末 21:00 UTC
    - cron: "0 21 L * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cannibalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - name: Detect keyword cannibalization
        run: npm run cannibalization

      - name: Create cannibalization issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('cannibalization-report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[cannibalization] キーワード重複レポート ${date}`,
              body,
              labels: ['rewrite'],
            });
