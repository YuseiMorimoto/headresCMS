name: prelaunch
on:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - name: Lint content
        run: npm run lint-content

      - name: Astro check
        run: npx astro check
        env:
          CONTENT_SOURCE: local

      - name: Build
        run: npm run build
        env:
          CONTENT_SOURCE: local
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}

      - name: Verify content
        run: npm run verify-content
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}

      - name: Prelaunch check
        run: npm run prelaunch
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
