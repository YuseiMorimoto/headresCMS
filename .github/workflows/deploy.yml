name: deploy
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-published]

env:
  CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE || 'local' }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
  # 未設定なら noindex + クロール禁止でデプロイされる（docs/07 公開スイッチ）
  PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      # wrangler deploy が読むのはビルドが生成する dist/server/wrangler.json であり、
      # そこへ wrangler.jsonc の内容が焼き込まれる。ビルド後に書き換えても反映されない。
      - name: Configure wrangler KV IDs
        if: vars.KV_NAMESPACE_ID != ''
        run: |
          sed -i "s/<KV_NAMESPACE_ID>/${{ vars.KV_NAMESPACE_ID }}/g" wrangler.jsonc
          SESSION_ID="${{ vars.SESSION_KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}"
          sed -i "s/<SESSION_KV_NAMESPACE_ID>/${SESSION_ID}/g" wrangler.jsonc

      - name: Lint content
        run: npm run lint-content

      - name: Astro check
        run: npx astro check
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Build
        run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: Verify content
        run: npm run verify-content

      - name: Prelaunch check (strict)
        if: vars.LAUNCH_STRICT == 'true'
        run: npm run prelaunch -- --strict

      - name: Prelaunch check
        if: vars.LAUNCH_STRICT != 'true'
        run: npm run prelaunch

      - name: Sync links to KV
        run: npm run sync-links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}

      # プレースホルダのまま進むと Cloudflare 側の難解なエラーになるため、
      # 設定漏れを名指しで落とす
      - name: Verify deploy config is resolved
        run: |
          if rg -q '<KV_NAMESPACE_ID>|<SESSION_KV_NAMESPACE_ID>' dist/server/wrangler.json; then
            echo "::error::KV namespace ID が未解決です。GitHub Variables に KV_NAMESPACE_ID（必要なら SESSION_KV_NAMESPACE_ID）を設定してください"
            exit 1
          fi
          echo "KV namespace ID は解決済み"

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
