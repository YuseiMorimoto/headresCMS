name: linkcheck
on:
  schedule:
    # 毎週土曜 03:00 JST = 金曜 18:00 UTC
    - cron: "0 18 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          CONTENT_SOURCE: local
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://example.com' }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE || 'https://img.example.com' }}

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './dist/client/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check affiliate offer URLs
        id: offers
        run: npm run check-offers -- --json
        continue-on-error: true
        env:
          OFFER_CHECK_OUTPUT: offer-check-results.json

      - name: Create issue on offer link failures
        if: steps.offers.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('offer-check-results.json', 'utf8'));
            const failures = data.failures ?? [];
            const body = [
              '## リンク切れ検査レポート（案件URL）',
              '',
              '以下の案件で遷移先URLの疎通に失敗しました。',
              '**`active: false` への変更は手動で行ってください**（自動では落としません）。',
              '',
              ...failures.map((f) =>
                `- [ ] \`${f.slug}\` → ${f.url} (status: ${f.status || f.error})`
              ),
              '',
              `検出日時: ${new Date().toISOString()}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[linkcheck] 案件URLの疎通失敗 (${failures.length}件)`,
              body,
              labels: ['linkcheck'],
            });

      - name: Fail if offers check failed
        if: steps.offers.outcome == 'failure'
        run: exit 1
